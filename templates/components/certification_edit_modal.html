<div id="edit-certification-modal" class="experience-form-modal" popover="auto" role="dialog" aria-modal="true"
    aria-labelledby="edit-certification-modal-title">
    <button type="button" class="experience-form-modal__backdrop" popovertarget="edit-certification-modal"
        popovertargetaction="hide" aria-label="Tutup form"></button>

    <div class="experience-form-modal__content">
        <button type="button" class="experience-form-modal__close" popovertarget="edit-certification-modal"
            popovertargetaction="hide" aria-label="Tutup form">×</button>

        <h2 id="edit-certification-modal-title">Edit Certification</h2>
        <form id="edit-certification-form" class="experience-form" novalidate>
            <input type="hidden" name="id">
            {% for field in edit_form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}
            <div class="experience-form-modal__actions">
                <button type="button" class="button button-secondary" popovertarget="edit-certification-modal"
                    popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Simpan Perubahan</button>
            </div>
        </form>
    </div>
</div>
