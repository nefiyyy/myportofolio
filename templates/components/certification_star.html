<form method="post" action="{% url 'main:toggle_certification_star' certification.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit" class="button button-star{% if user in certification.starred_by.all %} is-starred{% endif %}"
        title="{% if certification.starred_by.all %}Dibintangi oleh {{ certification.starred_by.all|join:', ' }}{% else %}Jadilah yang pertama memberi star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in certification.starred_by.all %}Unstar{% else %}Star{% endif %}
        <span class="star-count">{{ certification.starred_by.count }}</span>
    </button>
</form>
