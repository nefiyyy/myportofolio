<div id="add-certification-modal" class="experience-form-modal" popover="auto" role="dialog" aria-modal="true"
    aria-labelledby="add-certification-modal-title">
    <button type="button" class="experience-form-modal__backdrop" popovertarget="add-certification-modal"
        popovertargetaction="hide" aria-label="Tutup form"></button>

    <div class="experience-form-modal__content">
        <button type="button" class="experience-form-modal__close" popovertarget="add-certification-modal"
            popovertargetaction="hide" aria-label="Tutup form">×</button>

        <h2 id="add-certification-modal-title">Tambah Certification Baru</h2>
        <form id="certification-form" method="post" class="experience-form" novalidate>
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}
            <div class="experience-form-modal__actions">
                <button type="button" class="button button-secondary" popovertarget="add-certification-modal"
                    popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Certification</button>
            </div>
        </form>
    </div>
</div>
